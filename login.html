<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ferretería</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  
    <div class="login-page">
        <div class="login-container">
            <div class="login-box">
            
                <div class="login-header">
                    <div class="login-icon">🔧</div>
                    <h1>Sistema Ferretería</h1>
                    <p class="login-subtitle">Ingresa tus credenciales para acceder</p>
                </div>

                
                <form id="formLogin" class="login-form">
                    <div class="form-group">
                        <label for="loginEmail">
                            <i class="fas fa-envelope"></i> Correo Electrónico
                        </label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            placeholder="ejemplo@correo.com"
                            value="admin@ferreteria.com"
                            required
                            autocomplete="email"
                        >
                        <div class="form-error" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">
                            <i class="fas fa-lock"></i> Contraseña
                        </label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="loginPassword" 
                                placeholder="Ingresa tu contraseña"
                                value="admin123"
                                required
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                id="togglePassword" 
                                class="toggle-password"
                                title="Mostrar/Ocultar contraseña"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="form-error" id="passwordError"></div>
                    </div>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Recordarme</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-login" id="btnLogin">
                        <i class="fas fa-sign-in-alt"></i> Ingresar
                    </button>

                    <div id="loginMessage" class="login-message" style="display:none;"></div>
                </form>

            
                <div class="login-demo">
                    <p class="demo-title"> Credenciales de prueba</p>
                    <div class="demo-cards">
                        <div class="demo-card" onclick="cargarCredenciales('admin@ferreteria.com', 'admin123')">
                            <span class="demo-role"> Administrador</span>
                            <span class="demo-email">admin@ferreteria.com</span>
                        </div>
                        <div class="demo-card" onclick="cargarCredenciales('empleado@ferreteria.com', 'empleado123')">
                            <span class="demo-role"> Empleado</span>
                            <span class="demo-email">empleado@ferreteria.com</span>
                        </div>
                    </div>
                </div>

                <div class="login-footer">
                    <p>©  2026  -  Sistema Ferretería</p>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/models/usuario.js"></script>
    <script src="./src/database/datamanager.js"></script>
    <script src="./src/controllers/UsuarioController.js"></script>
    <script src="./src/views/loginview.js"></script> 
</body>
</html>
